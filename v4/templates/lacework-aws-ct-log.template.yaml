AWSTemplateFormatVersion: 2010-09-09
Description: Lacework AWS CloudTrail and Config Security Audit Integration (Log Archive Account)
Parameters:
  ResourceNamePrefix:
    Description: >-
      Names of resources created by the stack will be prefixed with this value
      to ensure uniqueness.
    Type: String
    Default: laceworkalliances
    MinLength: '1'
    MaxLength: '45'
    AllowedPattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
    ConstraintDescription: >-
      Invalid resource name prefix value.  Must match pattern
      ^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$
  ExternalID:
    Default: 4CEBE3B
    Description: >-
      The cross-account access role created by the stack will use this value for
      its ExternalID.
    Type: String
    MinLength: '2'
    MaxLength: '1224'
  CloudTrailS3BucketName:
    Description: The S3 bucket name for your CloudTrail setup. The bucket must be owned by the current account.
    Default: ''
    Type: String
    MaxLength: '128'
  CloudTrailSnsTopicArn:
    Type: String
    Description: The SNS Topic ARN (if one exists) for your CloudTrail setup. Leave blank to create a new SNS Topic.
    Default: ""
  KMSKeyIdArn:
    Description: The KMS key ARN for decrypting S3 log files if necessary.
    Default: ''
    Type: String
  SqsQueueUrl:
    Type: String
    Description: The SQS Queue URL.
    AllowedPattern: '^(([^:/?#]+):)?(//([^/?#]*))?([^?#]*)(\?([^#]*))?(#(.*))?'
    ConstraintDescription: Contains a URL/URI pattern only, ie. https://sqs.<region>.amazonaws.com/<account>/<name>
    Default: "https://sqs.<region>.amazonaws.com/<account>/<name>"
  SqsQueueArn:
    Type: String
    Description: The SQS Queue Arn.
  AuditAccountId:
    Type: String
    Description: The Account ID of the Audit Account that will subscribe to the CloudTrail SNS Topic.
    Default: ""

Conditions:
  UseKMSDecrypt: !Not [!Equals [!Ref KMSKeyIdArn, '']]
  CloudTrailSnsTopicExists: !Not [!Equals [!Ref CloudTrailSnsTopicArn, '']]
  CloudTrailSnsTopicNotExists: !Equals [!Ref CloudTrailSnsTopicArn, '']

Resources:
  LaceworkCWSSACrossAccountAccessRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub "${ResourceNamePrefix}-laceworkcwssarole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::434813966438:role/lacework-platform'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalID

  LaceworkCWSPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Sub "LaceworkCWSLogPolicy-${AWS::AccountId}"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ConsumeNotifications
            Action:
              - 'sqs:GetQueueAttributes'
              - 'sqs:GetQueueUrl'
              - 'sqs:DeleteMessage'
              - 'sqs:ReceiveMessage'
            Effect: Allow
            Resource: !Ref SqsQueueArn
          - Sid: AccessLogFiles
            Action:
              - 's3:Get*'
              - 's3:ListBucket'
            Effect: Allow
            Resource:
              - !Sub "arn:aws:s3:::${CloudTrailS3BucketName}/*AWSLogs/*"
              - 'arn:aws:s3:::aws-controltower-config-logs-*'
              - 'arn:aws:s3:::aws-controltower-config-logs-*/*'
          - Sid: GetAccountAlias
            Action:
              - 'iam:ListAccountAliases'
            Effect: Allow
            Resource: '*'
          - Sid: Debug
            Action:
              - 'cloudtrail:DescribeTrails'
              - 'cloudtrail:GetTrailStatus'
              - 'eks:ListTagsForResource'
              - 's3:GetBucketPolicy'
              - 's3:GetBucketLocation'
              - 'sns:GetTopicAttributes'
              - 'sns:ListSubscriptions'
              - 'sns:ListTopics'
            Effect: Allow
            Resource: '*'
      Roles:
        - !Ref LaceworkCWSSACrossAccountAccessRole

  CloudTrailSnsTopicPolicy:
    Type: 'AWS::SNS::TopicPolicy'
    Condition: CloudTrailSnsTopicExists
    Properties:
      Topics:
        - !Ref CloudTrailSnsTopicArn
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudTrailPublish
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "sns:Publish"
            Resource: !Ref CloudTrailSnsTopicArn
          - Sid: AllowAuditAccountToSubscribe
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AuditAccountId}:root"
            Action:
              - 'sns:Subscribe'
              - 'sns:Receive'
            Resource: !Ref CloudTrailSnsTopicArn

  # Create new SNS topic for CloudTrail if no existing one is provided
  LaceworkCloudTrailSnsTopic:
    Type: 'AWS::SNS::Topic'
    Condition: CloudTrailSnsTopicNotExists
    Properties:
      TopicName: !Sub "${ResourceNamePrefix}-lacework-cloudtrail-sns"
      DisplayName: Lacework CloudTrail Notifications

  LaceworkCloudTrailSnsTopicPolicy:
    Type: 'AWS::SNS::TopicPolicy'
    Condition: CloudTrailSnsTopicNotExists
    Properties:
      Topics:
        - !Ref LaceworkCloudTrailSnsTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudTrailPublish
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "sns:Publish"
            Resource: !Ref LaceworkCloudTrailSnsTopic
          - Sid: AllowAuditAccountToSubscribe
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AuditAccountId}:root"
            Action:
              - 'sns:Subscribe'
              - 'sns:Receive'
            Resource: !Ref LaceworkCloudTrailSnsTopic

  LaceworkCWSDecryptPolicy:
    Type: 'AWS::IAM::Policy'
    Condition: UseKMSDecrypt
    Properties:
      PolicyName: LaceworkCWSDecryptPolicy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DecryptLogFiles
            Action:
              - 'kms:Decrypt'
            Effect: Allow
            Resource: !Ref KMSKeyIdArn
      Roles:
        - !Ref LaceworkCWSSACrossAccountAccessRole

Outputs:
  RoleARN:
    Description: >-
      Cross-account access role ARN to share with Lacework for CloudTrail
      integration
    Value: !GetAtt LaceworkCWSSACrossAccountAccessRole.Arn
  SQSQueueURL:
    Description: SQS Queue URL to share with Lacework for CloudTrail Integration
    Value: !Ref SqsQueueUrl
  CloudTrailSnsTopicArn:
    Description: SNS Topic ARN to share with Lacework for CloudTrail Integration
    Condition: CloudTrailSnsTopicNotExists
    Value: !Ref LaceworkCloudTrailSnsTopic
  TemplateVersion:
    Description: Template version
    Value: '1.1'
