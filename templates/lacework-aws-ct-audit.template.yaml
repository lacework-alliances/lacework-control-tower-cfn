AWSTemplateFormatVersion: 2010-09-09
Description: Lacework AWS CloudTrail and Config Security Audit Integration (Audit Account)
Parameters:
  ResourceNamePrefix:
    Description: >-
      Names of resources created by the stack will be prefixed with this value
      to ensure uniqueness.
    Type: String
    Default: laceworkalliances
    MinLength: '1'
    MaxLength: '45'
    AllowedPattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
    ConstraintDescription: >-
      Invalid resource name prefix value.  Must match pattern
      ^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$
  ExistingTrailTopicArn:
    Description: Provide the ARN of the SNS topic for your existing trail setup.
    Default: ''
    Type: String
  CrossAccountAccessRoleArn:
    Description: The cross account role to use for access. Typically, this is the Log account cross account role.
    Default: ''
    Type: String
  ConfigBucketName:
    Type: String
    Description: "The name of the AWS Config bucket created by Control Tower 4.0 (e.g., aws-controltower-config-12345...)"
    Default: ''
Conditions:
  HasConfigBucket: !Not [!Equals [!Ref ConfigBucketName, '']]
Resources:
  LaceworkCWSSubscription:
    Type: 'AWS::SNS::Subscription'
    Properties:
      Endpoint: !GetAtt
        - LaceworkCWSQueue
        - Arn
      Protocol: sqs
      TopicArn: !Ref ExistingTrailTopicArn
  LaceworkCWSQueue:
    Type: 'AWS::SQS::Queue'
    Properties:
      QueueName: !Join ['',[!Ref ResourceNamePrefix, "-laceworkcws" ]]
  LaceworkCWSQueuePolicy:
    Type: 'AWS::SQS::QueuePolicy'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AwsSnsAccess
            Effect: Allow
            Principal: '*'
            Action:
              - 'sqs:SendMessage'
            Resource: '*'
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref ExistingTrailTopicArn
          - Sid: CrossAccountSqsAccess
            Effect: Allow
            Principal:
              AWS: !Ref CrossAccountAccessRoleArn
            Action:
              - 'sqs:DeleteMessage'
              - 'sqs:ReceiveMessage'
              - 'sqs:GetQueueAttributes'
              - 'sqs:GetQueueUrl'
            Resource: !GetAtt LaceworkCWSQueue.Arn
          - Sid: AllowCTSNSToSendMessage
            Effect: Allow
            Principal:
              Service: "sns.amazonaws.com"
            Action: "sqs:SendMessage"
            Resource: !GetAtt LaceworkCWSQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:aws-controltower-AllConfigNotifications"
      Queues:
        - !Ref LaceworkCWSQueue
  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasConfigBucket
    Properties:
      Bucket: !Ref ConfigBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLaceworkRead
            Effect: Allow
            Principal:
              AWS: !Ref CrossAccountAccessRoleArn
            Action:
              - 's3:GetBucketLocation'
              - 's3:ListBucket'
              - 's3:GetObject'
            Resource:
              - !Sub "arn:aws:s3:::${ConfigBucketName}"
              - !Sub "arn:aws:s3:::${ConfigBucketName}/*"
Outputs:
  SQSQueueURL:
    Description: SQS queue URL to share with Lacework for CloudTrail Integration
    Value: !Ref LaceworkCWSQueue
  TemplateVersion:
    Description: Template version
    Value: '1.1'
